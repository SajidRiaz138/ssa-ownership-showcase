apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.sourceConfigMap }}
  labels: { app.kubernetes.io/instance: {{ .Release.Name }} }
data:
  desired: "v1"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.targetConfigMap }}
  labels: { app.kubernetes.io/instance: {{ .Release.Name }} }
{{- if .Values.chartWritesMessage }}
data:
  # *** v1 ANTI-PATTERN: the chart writes the field the application also writes. ***
  {{ .Values.ownedKey }}: {{ .Values.chartMessage | quote }}
{{- end }}
